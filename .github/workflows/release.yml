name: Release

# Fully automatic: every push to main is checked against
# custom_components/indi_client/manifest.json's "version". If that
# version has no release yet, this creates the vX.Y.Z tag and the
# GitHub Release for it - no manual `git tag && git push` step needed.
# A direct push of a "vX.Y.Z" tag is still supported for one-off/manual
# releases, and is cross-checked against the manifest the same way.
#
# Debounce: a push to main first waits RELEASE_WAIT_SECONDS (5 min). If
# another commit lands on main in the meantime, this run is skipped and
# the newer run decides - so a burst of merged PRs yields one release.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

env:
  RELEASE_WAIT_SECONDS: 300

jobs:
  debounce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - name: Wait, then check this is still the tip of main
        id: check
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep "$RELEASE_WAIT_SECONDS"
          head=$(git ls-remote "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "Newer commit $head on main; skipping, its run will release."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: debounce
    if: needs.debounce.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: manifest
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/indi_client/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            manifest_version="${{ steps.manifest.outputs.version }}"
            if [ "${tag#v}" != "$manifest_version" ]; then
              echo "::error::Tag $tag does not match manifest.json version $manifest_version"
              exit 1
            fi
          else
            tag="v${{ steps.manifest.outputs.version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: github.ref_type != 'tag' && steps.exists.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, 'b') || contains(steps.tag.outputs.tag, 'a') || contains(steps.tag.outputs.tag, 'rc') }}
